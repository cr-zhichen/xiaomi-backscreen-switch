[tools]
java = "temurin-17.0.16+8"
gradle = "8.13.0"
android-sdk = "19.0"
actionlint = "1.7.12"
shellcheck = "0.11.0"

[tasks.sdk]
description = "接受 Android SDK 许可证并安装编译依赖"
run = [
  "yes | sdkmanager --licenses > /dev/null",
  "sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'",
]

[tasks.signing]
description = "准备并保留本地调试签名"
run = """
mkdir -p .signing
if [ ! -f .signing/debug.keystore ]; then
  keytool -genkeypair -keystore .signing/debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=BackScreen, O=Personal, C=CN'
fi
"""

[tasks.build]
description = "构建可安装的 APK"
depends = ["signing"]
run = "gradle --no-daemon assembleDebug"

[tasks.check]
description = "运行 Android Lint"
run = "gradle --no-daemon lintDebug"

[tasks.verify-core]
description = "验证副屏控制、版本比较和更新选择逻辑"
run = "gradle --no-daemon testDebugUnitTest"

[tasks.verify]
description = "检查代码并运行控制逻辑回归测试"
depends = ["workflows:lint"]
run = "gradle --no-daemon lintDebug testDebugUnitTest"

[tasks.package]
description = "验证并构建交付 APK"
depends = ["signing", "workflows:lint"]
run = "gradle --no-daemon lintDebug testDebugUnitTest assembleDebug"

[tasks.install]
description = "安装 APK 到指定设备（通过 ANDROID_SERIAL 指定）"
run = "adb install -r app/build/outputs/apk/debug/app-debug.apk"

[tasks.export-apk]
description = "导出 APK 到 APP_OUTPUT_DIR（默认 dist）"
run = """
mkdir -p "${APP_OUTPUT_DIR:-dist}"
cp app/build/outputs/apk/debug/app-debug.apk "${APP_OUTPUT_DIR:-dist}/xiaomi-backscreen-switch.apk"
"""

[tasks."workflows:lint"]
description = "检查 GitHub Actions 和发布脚本"
run = [
  "actionlint .github/workflows/*.yml",
  "shellcheck scripts/*.sh",
]

[tasks."signing:generate-release"]
description = "首次生成加密发布证书和本地随机密码（不会覆盖已有文件）"
run = "bash scripts/generate-release-key.sh"

[tasks."release:validate-tag"]
description = "确认发布 Tag 存在并指向当前提交"
run = '''
set -eu
: "${RELEASE_TAG:?请设置 RELEASE_TAG}"
git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
test "$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")" = "$(git rev-parse HEAD)"
'''

[tasks.release]
description = "检查、构建并验证签名发布 APK"
depends = ["workflows:lint"]
run = "bash scripts/build-release.sh"
